<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Dashboard</title>
  <link rel="stylesheet" href="../global/maincontent.css" />
  <link rel="stylesheet" href="../global/sidebar.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="../global/sidebar.js" defer></script>
  <script src="../../globals/initilization.js" defer></script>
  <script src="dashboard.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="main-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Kick Stock</h2>
      <ul class="nav-list">
        <li><div class="nav-item" data-url="../dashboard/dashboard.html"><a href="#">Dashboard</a></div></li>
        <li><div class="nav-item" data-url="../products/products.html"><a href="#">Products</a></div></li>
        <li><div class="nav-item" data-url="../orders/orders.html"><a href="#">Orders</a></div></li>
        <li><div class="nav-item" data-url="../users/users.html"><a href="#">Users</a></div></li>
        <li><div class="nav-item" data-url="../storage/storage.html"><a href="#">Storage</a></div></li>
        <li><div class="nav-item" data-url="../promoCode/promo.html"><a href="#">Promo Code</a></div></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <h2>Dashboard Overview</h2>
      <div class="dashboard-panels">
        <div class="panel" id="profit-panel">
          <div class="panel-value" id="profit-count">0</div>
          <h3>Profit</h3>
          <p class="panel-desc" id="profit-desc"></p>
        </div>
        <div class="panel" id="products-panel">
          <div class="panel-value" id="products-count">0</div>
          <h3>Products</h3>
          <p class="panel-desc" id="products-desc"></p>
        </div>
        <div class="panel" id="users-panel">
          <div class="panel-value" id="users-count">0</div>
          <h3>Users</h3>
          <p class="panel-desc" id="users-desc"></p>
        </div>
      </div>

      <!-- Graph -->
      <div class="dashboard-graph">
        <div class="chart-controls">
          <label>Year:
            <select id="filter-year"></select>
          </label>
          <label>From:
            <select id="filter-month-from"></select>
          </label>
          <label>To:
            <select id="filter-month-to"></select>
          </label>
          <button id="apply-filter">Apply</button>
        </div>
        <canvas id="profitLineChart"></canvas>
      </div>
      <div class="dashboard-graph">
        <canvas id="ordersPieChart"></canvas>
      </div>

    </main>
  </div>
</body>
</html>
