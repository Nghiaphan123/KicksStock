<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Account</title>
  <link rel="stylesheet" href="../global/maincontent.css" />
  <link rel="stylesheet" href="../global/sidebar.css" />
  <script src="../global/sidebar.js" defer></script>
  <link rel="stylesheet" href="style.css" />
  <script src="users.js" defer></script>
</head>

<body>
  <div class="main-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Kick Stock</h2>
      <ul class="nav-list">
        <li>
          <div class="nav-item" data-url="../dashboard/dashboard.html"><a href="#">Dashboard</a></div>
        </li>
        <li>
          <div class="nav-item" data-url="../products/products.html"><a href="#">Products</a></div>
        </li>
        <li>
          <div class="nav-item" data-url="../orders/orders.html"><a href="#">Orders</a></div>
        </li>
        <li>
          <div class="nav-item" data-url="../users/users.html"><a href="#">Users</a></div>
        </li>
        <li>
          <div class="nav-item" data-url="../storage/storage.html"><a href="#">Storage</a></div>
        </li>
        <li>
          <div class="nav-item" data-url="../promoCode/promo.html"><a href="#">Promo Code</a></div>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <h2>Users</h2>
      <div class="users-filters">
        <div class="filter-group">
          <input type="text" id="filter-id" placeholder="User ID..." />
        </div>
        <div class="filter-group">
          <input type="text" id="filter-name" placeholder="Name..." />
        </div>
        <div class="filter-group">
          <input type="text" id="filter-email" placeholder="Email..." />
        </div>
        <div class="filter-group">
          <input type="text" id="filter-phone" placeholder="Phone..." />
        </div>
        <div class="filter-group">
          <select id="filter-role">
            <option value="">All Roles</option>
            <option value="customer">Customer</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="filter-group">
          <select id="filter-status">
            <option value="">All Status</option>
            <option value="active">Active</option>
            <option value="banned">Banned</option>
            <option value="unchangeable">Unchangeable</option>
          </select>
        </div>
        <button id="clear-filters" class="clear-btn">✖ Clear</button>
      </div>
      <div class="users-wrapper">
        <table class="users-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Role</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="users-body">
            <!-- Users injected here -->
          </tbody>
        </table>
      </div>

      <!-- Pagination bar -->
      <div id="pagination" class="pagination"></div>
    </main>
  </div>
</body>

</html>
