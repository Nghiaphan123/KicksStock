<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Manager Orders</title>
	<link rel="stylesheet" href="../global/maincontent.css" />
	<link rel="stylesheet" href="../global/sidebar.css" />
	<link rel="stylesheet" href="style.css" />
	<script src="../global/sidebar.js" defer></script>
	<script src="orders.js" defer></script>
</head>

<body>
	<div class="main-container">
		<!-- Sidebar -->
		<aside class="sidebar">
			<h2>Kick Stock</h2>
			<ul class="nav-list">
				<li><div class="nav-item" data-url="../dashboard/dashboard.html"><a href="#">Dashboard</a></div></li>
				<li><div class="nav-item" data-url="../products/products.html"><a href="#">Products</a></div></li>
				<li><div class="nav-item" data-url="../orders/orders.html"><a href="#">Orders</a></div></li>
				<li><div class="nav-item" data-url="../users/users.html"><a href="#">Users</a></div></li>
				<li><div class="nav-item" data-url="../storage/storage.html"><a href="#">Storage</a></div></li>
				<li><div class="nav-item" data-url="../promoCode/promo.html"><a href="#">Promo Code</a></div></li>
			</ul>
		</aside>

		<!-- Main Content -->
		<main class="main-content">
			<h2>Recent Orders</h2>

			<!-- Search & Filter Bar -->
			<div class="search-bar">
				<div class="search-input-wrap">
					<i class="search-icon">🔍</i>
					<input type="text" id="search-orderid" placeholder="Order ID..." oninput="applyFilters()">
				</div>
				<div class="search-input-wrap">
					<i class="search-icon">📅</i>
					<input type="date" id="search-date" onchange="applyFilters()">
				</div>
				<div class="search-input-wrap">
					<i class="search-icon">👤</i>
					<input type="text" id="search-customer" placeholder="Customer Name..." oninput="applyFilters()">
				</div>
				<div class="status-btns">
					<button class="status-btn active-btn" data-status="all"      onclick="setStatusFilter('all')">All</button>
					<button class="status-btn btn-pending"  data-status="pending"  onclick="setStatusFilter('pending')">Pending</button>
					<button class="status-btn btn-done"     data-status="done"     onclick="setStatusFilter('done')">Done</button>
					<button class="status-btn btn-canceled" data-status="canceled" onclick="setStatusFilter('canceled')">Canceled</button>
				</div>
				<button class="clear-btn" onclick="clearFilters()">✕ Clear</button>
			</div>

			<div class="orders-wrapper">
				<table class="orders-table">
				<thead>
					<tr>
					<th>Order ID</th>
					<th>Time</th>
					<th>Date</th>
					<th>Payment Method</th>
					<th>Customer Name</th>
					<th>Status</th>
					<th>Total</th>
					</tr>
				</thead>
				<tbody id="orders-body">
					<!-- Orders injected here -->
				</tbody>
				</table>
			</div>

			<!-- Pagination bar -->
			<div id="pagination" class="pagination"></div>
		</main>
	</div>
</body>

</html>
