<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Storage</title>
  <link rel="stylesheet" href="../global/maincontent.css" />
  <link rel="stylesheet" href="../global/sidebar.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="../global/sidebar.js" defer></script>
  <script src="../../globals/initilization.js" defer></script>
  <script src="storage.js" defer></script>
</head>
<body>
  <div class="main-container">
    <aside class="sidebar">
      <h2>Kick Stock</h2>
      <ul class="nav-list">
        <li><div class="nav-item" data-url="../dashboard/dashboard.html"><a href="#">Dashboard</a></div></li>
        <li><div class="nav-item" data-url="../products/products.html"><a href="#">Products</a></div></li>
        <li><div class="nav-item" data-url="../orders/orders.html"><a href="#">Orders</a></div></li>
        <li><div class="nav-item" data-url="../users/users.html"><a href="#">Users</a></div></li>
        <li><div class="nav-item" data-url="../storage/storage.html"><a href="#">Storage</a></div></li>
        <li><div class="nav-item" data-url="../promoCode/promo.html"><a href="#">Promo Code</a></div></li>
      </ul>
    </aside>

    <main class="main-content">

      <!-- Header -->
      <div class="storage-page-header">
        <h1>Storage</h1>
        <button id="create-order-btn" class="btn-create-order">+ Create Purchase Order</button>
      </div>

      <!-- Summary cards -->
      <div class="storage-summary-cards" id="summary-cards"></div>

      <!-- Product table by supplier -->
      <div class="supplier-tabs" id="supplier-tabs"></div>
      <div class="storage-container">
        <div class="product-card-row header-row">
          <div>ID</div>
          <div>Product</div>
          <div>Stock</div>
          <div>Import Price (75%)</div>
          <div>Add Qty</div>
        </div>
        <div id="storage-list"></div>
      </div>

      <div class="storage-actions">
        <span id="total-price" class="total-label">Total: $0.00</span>
        <div class="action-btns">
          <button id="clear-btn" class="btn-clear">Clear</button>
          <button id="buy-btn" class="btn-buy">Restock</button>
        </div>
      </div>

      <!-- Purchase Notes -->
      <div class="section-divider">
        <h2>Purchase History</h2>
      </div>
      <div class="note-card header-row">
        <div>ID</div>
        <div>Supplier</div>
        <div>Total</div>
        <div>Date</div>
      </div>
      <div class="storage-notes">
        <div id="notes-list"></div>
      </div>
      <div class="notes-pagination" id="notes-pagination"></div>

    </main>
  </div>
</body>
</html>
